name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      # rubygems/configure-rubygems-credentials can't pass `owner`, which
      # rubygems.org requires on the first push from a pending trusted publisher.
      # 81524 is the immutable ID of Marc's rubygems.org account.
      - name: Exchange the GitHub OIDC token for a rubygems.org API key
        run: |
          jwt=$(curl -sS --fail-with-body -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=rubygems.org" | jq -r .value)
          key=$(curl -sS --fail-with-body -X POST https://rubygems.org/api/v1/oidc/trusted_publisher/exchange_token \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg jwt "$jwt" '{jwt: $jwt, owner: "81524"}')" | jq -r .rubygems_api_key)
          echo "::add-mask::$key"
          echo "GEM_HOST_API_KEY=$key" >> "$GITHUB_ENV"
      - name: Build and publish to rubygems.org
        run: |
          gem build verify_human.gemspec
          gem push verify_human-*.gem
